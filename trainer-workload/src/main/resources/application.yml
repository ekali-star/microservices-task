server:
  port: 8081

spring:
  application:
    name: trainer-workload
  jackson:
    serialization:
      write-dates-as-timestamps: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: your-256-bit-secret-key-here-must-be-at-least-32-chars
  expiration-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.trainerworkload: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{transactionId}] %-5level %logger{36} - %msg%n"
